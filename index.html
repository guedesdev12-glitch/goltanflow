<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CreditFlow — Retorno Bancário</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500;600&family=DM+Serif+Display&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@2.44.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'DM Sans',sans-serif;background:#0f1117;color:#e8eaf0;min-height:100vh;overflow-x:hidden}
:root{--bg:#0f1117;--surface:#181c27;--surface2:#1e2233;--border:#2a2f42;--accent:#3b7ef8;--accent2:#5b9bff;--text:#e8eaf0;--muted:#8b91a8;--green:#22c55e;--red:#ef4444;--amber:#f59e0b;--blue:#3b7ef8;--card-r:12px}

#loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;background:#0f1117;position:relative;overflow:hidden}
#loginScreen::before{content:'';position:absolute;width:600px;height:600px;background:radial-gradient(circle,rgba(59,126,248,.12) 0%,transparent 70%);top:-100px;left:-100px;pointer-events:none}
#loginScreen::after{content:'';position:absolute;width:400px;height:400px;background:radial-gradient(circle,rgba(59,126,248,.08) 0%,transparent 70%);bottom:-80px;right:-80px;pointer-events:none}
.login-box{background:#181c27;border:1px solid #2a2f42;border-radius:20px;padding:42px 40px;width:100%;max-width:400px;position:relative;z-index:1}
.login-logo{display:flex;align-items:center;gap:10px;margin-bottom:32px;justify-content:center}
.login-logo-icon{width:42px;height:42px;background:linear-gradient(135deg,#3b7ef8,#5b9bff);border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:20px}
.login-logo-text{font-family:'DM Serif Display',serif;font-size:22px;color:#e8eaf0;letter-spacing:-.3px}
.login-title{font-size:20px;font-weight:600;color:#e8eaf0;margin-bottom:4px;text-align:center}
.login-sub{font-size:13px;color:#8b91a8;text-align:center;margin-bottom:28px}
.form-group{margin-bottom:16px}
.form-label{font-size:12px;font-weight:500;color:#8b91a8;margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.05em}
.form-input{width:100%;padding:11px 14px;background:#0f1117;border:1px solid #2a2f42;border-radius:8px;color:#e8eaf0;font-size:14px;font-family:'DM Sans',sans-serif;transition:.2s}
.form-input:focus{outline:none;border-color:#3b7ef8;background:#111520}
.form-input::placeholder{color:#4a5068}
.btn-login{width:100%;padding:12px;background:linear-gradient(135deg,#3b7ef8,#5b9bff);border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:.2s;margin-top:8px}
.btn-login:hover{opacity:.9;transform:translateY(-1px)}
.login-hint{font-size:12px;color:#4a5068;text-align:center;margin-top:16px}
.login-error{font-size:13px;color:#ef4444;text-align:center;margin-top:10px;display:none}

#app{display:none;min-height:100vh;background:#0f1117}
.sidebar{position:fixed;left:0;top:0;width:220px;height:100vh;background:#181c27;border-right:1px solid #2a2f42;display:flex;flex-direction:column;z-index:100}
.sidebar-logo{padding:22px 20px;display:flex;align-items:center;gap:10px;border-bottom:1px solid #2a2f42}
.sidebar-logo-icon{width:34px;height:34px;background:linear-gradient(135deg,#3b7ef8,#5b9bff);border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:16px}
.sidebar-logo-text{font-family:'DM Serif Display',serif;font-size:17px;color:#e8eaf0}
.sidebar-nav{flex:1;padding:16px 12px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;color:#8b91a8;font-size:13px;font-weight:500;transition:.15s;margin-bottom:2px}
.nav-item:hover{background:#1e2233;color:#e8eaf0}
.nav-item.active{background:#1e2a4a;color:#5b9bff}
.nav-item i{font-size:17px}
.sidebar-footer{padding:16px;border-top:1px solid #2a2f42}
.user-chip{display:flex;align-items:center;gap:10px}
.user-avatar{width:32px;height:32px;background:linear-gradient(135deg,#3b7ef8,#22c55e);border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:#fff;flex-shrink:0}
.user-name{font-size:13px;font-weight:500;color:#e8eaf0}
.user-role{font-size:11px;color:#8b91a8}
.btn-logout{background:none;border:none;color:#8b91a8;cursor:pointer;font-size:20px;margin-left:auto;transition:.15s}
.btn-logout:hover{color:#ef4444}

.main{margin-left:220px;min-height:100vh}
.topbar{padding:20px 28px;border-bottom:1px solid #2a2f42;display:flex;align-items:center;justify-content:space-between;background:#181c27;position:sticky;top:0;z-index:50}
.page-title{font-size:18px;font-weight:600;color:#e8eaf0}
.page-sub{font-size:13px;color:#8b91a8;margin-top:2px}
.date-chip{font-size:12px;color:#8b91a8;background:#1e2233;border:1px solid #2a2f42;border-radius:20px;padding:5px 12px}
.content{padding:28px}

.metrics-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
.metric-card{background:#181c27;border:1px solid #2a2f42;border-radius:var(--card-r);padding:20px 22px;position:relative;overflow:hidden}
.metric-card::before{content:'';position:absolute;top:0;left:0;right:0;height:3px}
.mc-day::before{background:linear-gradient(90deg,#3b7ef8,#5b9bff)}
.mc-week::before{background:linear-gradient(90deg,#22c55e,#4ade80)}
.mc-month::before{background:linear-gradient(90deg,#f59e0b,#fbbf24)}
.metric-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:#8b91a8;margin-bottom:10px}
.metric-value{font-size:36px;font-weight:300;color:#e8eaf0;line-height:1;font-family:'DM Serif Display',serif}
.metric-sub{font-size:12px;color:#8b91a8;margin-top:6px}
.metric-icon{position:absolute;right:18px;top:50%;transform:translateY(-50%);font-size:36px;opacity:.08;color:#fff}

.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.section-title{font-size:14px;font-weight:600;color:#e8eaf0}
.btn-new{display:flex;align-items:center;gap:6px;padding:8px 16px;background:#3b7ef8;border:none;border-radius:7px;color:#fff;font-size:13px;font-weight:500;font-family:'DM Sans',sans-serif;cursor:pointer;transition:.15s}
.btn-new:hover{background:#5b9bff}

.proposals-table{background:#181c27;border:1px solid #2a2f42;border-radius:var(--card-r);overflow:hidden}
.table-head{display:grid;grid-template-columns:2fr 1fr 1.5fr 1fr 100px;padding:12px 16px;border-bottom:1px solid #2a2f42;font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.07em;color:#8b91a8}
.table-row{display:grid;grid-template-columns:2fr 1fr 1.5fr 1fr 100px;padding:13px 16px;border-bottom:1px solid #1e2233;align-items:center;transition:.15s}
.table-row:last-child{border-bottom:none}
.table-row:hover{background:#1e2233}
.td-name{font-size:13px;font-weight:500;color:#e8eaf0}
.td-date{font-size:12px;color:#8b91a8}
.td-banks{display:flex;flex-wrap:wrap;gap:4px}
.bank-mini-badge{font-size:10px;background:#1e2233;border:1px solid #2a2f42;color:#8b91a8;padding:2px 7px;border-radius:4px}
.status-badge{font-size:11px;font-weight:500;padding:3px 8px;border-radius:5px;display:inline-block}
.sb-ap{background:rgba(34,197,94,.12);color:#22c55e;border:1px solid rgba(34,197,94,.2)}
.sb-neg{background:rgba(239,68,68,.12);color:#ef4444;border:1px solid rgba(239,68,68,.2)}
.sb-pen{background:rgba(245,158,11,.12);color:#f59e0b;border:1px solid rgba(245,158,11,.2)}
.sb-mix{background:rgba(59,126,248,.12);color:#5b9bff;border:1px solid rgba(59,126,248,.2)}
.td-action{display:flex;gap:5px}
.td-action button{background:none;border:1px solid #2a2f42;color:#8b91a8;border-radius:6px;padding:4px 10px;font-size:11px;cursor:pointer;font-family:'DM Sans',sans-serif;transition:.15s}
.td-action button:hover{border-color:#3b7ef8;color:#5b9bff}
.empty-state{padding:48px;text-align:center;color:#8b91a8;font-size:13px}

.form-card{background:#181c27;border:1px solid #2a2f42;border-radius:var(--card-r);padding:22px 24px;margin-bottom:20px}
.form-card-title{font-size:13px;font-weight:600;color:#e8eaf0;margin-bottom:18px;display:flex;align-items:center;gap:8px}
.step-num{width:22px;height:22px;background:#1e2a4a;border:1px solid #3b7ef8;border-radius:50%;font-size:11px;color:#5b9bff;display:flex;align-items:center;justify-content:center;font-weight:600;flex-shrink:0}
.field-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field-label{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:#8b91a8;margin-bottom:6px;display:block}
.field-input{width:100%;padding:10px 12px;background:#0f1117;border:1px solid #2a2f42;border-radius:7px;color:#e8eaf0;font-size:13px;font-family:'DM Sans',sans-serif;transition:.2s}
.field-input:focus{outline:none;border-color:#3b7ef8}
.field-input::placeholder{color:#3a3f55}
select.field-input option{background:#181c27}

.banks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}
.bank-tile{padding:10px 8px;background:#0f1117;border:1px solid #2a2f42;border-radius:8px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px;transition:.2s;text-align:center;user-select:none}
.bank-tile:hover{border-color:#3b7ef8;background:#111520}
.bank-tile.sel{border-color:#3b7ef8;background:#1e2a4a}
.bank-logo{width:36px;height:36px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.bank-logo img{width:32px;height:32px;object-fit:contain;}
.bank-tile-name{font-size:11px;color:#8b91a8;font-weight:500;line-height:1.2}
.bank-tile.sel .bank-tile-name{color:#5b9bff}

.retorno-block{border:1px solid #2a2f42;border-radius:8px;margin-bottom:10px;overflow:hidden}
.rb-header{padding:10px 14px;background:#1e2233;display:flex;align-items:center;gap:10px}
.rb-logo{width:28px;height:28px;border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;flex-shrink:0}
.rb-name{font-size:13px;font-weight:600;color:#e8eaf0}
.rb-body{padding:12px 14px}
.pills-section-label{font-size:11px;font-weight:600;color:#8b91a8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:6px;margin-top:10px}
.pills-section-label:first-child{margin-top:0}
.pills-row{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:4px}
.pill{padding:5px 13px;border:1px solid #2a2f42;border-radius:99px;font-size:11px;cursor:pointer;background:#0f1117;color:#8b91a8;transition:.15s;white-space:nowrap;user-select:none}
.pill:hover{border-color:#8b91a8;color:#e8eaf0}
.pill.p-ap{border-color:#22c55e;background:rgba(34,197,94,.1);color:#22c55e}
.pill.p-neg{border-color:#ef4444;background:rgba(239,68,68,.1);color:#ef4444}
.pill.p-pen{border-color:#f59e0b;background:rgba(245,158,11,.1);color:#f59e0b}
.pill.p-info{border-color:#3b7ef8;background:rgba(59,126,248,.1);color:#5b9bff}
.defesa-box{background:#1a1010;border:1px solid rgba(239,68,68,.25);border-radius:7px;padding:10px 12px;margin-top:10px;display:none}
.defesa-box.show{display:block}
.defesa-label{font-size:11px;color:#ef4444;font-weight:600;margin-bottom:8px;display:flex;align-items:center;gap:6px}
.defesa-pills{display:flex;flex-wrap:wrap;gap:6px}
.dp{padding:4px 11px;border:1px solid rgba(239,68,68,.3);border-radius:99px;font-size:11px;cursor:pointer;background:transparent;color:#ef4444;transition:.15s;white-space:nowrap;user-select:none}
.dp:hover{background:rgba(239,68,68,.1)}
.dp.sel{background:rgba(239,68,68,.15);border-color:#ef4444;font-weight:600}
.dp.sel-no{background:rgba(100,100,100,.12);border-color:#555;color:#8b91a8;font-weight:600}
.obs-ta{width:100%;background:#0f1117;border:1px solid #2a2f42;border-radius:6px;color:#e8eaf0;font-size:12px;font-family:'DM Sans',sans-serif;padding:7px 10px;resize:vertical;min-height:46px;margin-top:10px}
.obs-ta::placeholder{color:#3a3f55}
.obs-ta:focus{outline:none;border-color:#3b7ef8}

.btn-row{display:flex;gap:10px;margin-top:4px;flex-wrap:wrap}
.btn-save{flex:1;min-width:160px;padding:12px;background:#3b7ef8;border:none;border-radius:8px;color:#fff;font-size:14px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:.15s}
.btn-save:hover{background:#5b9bff}
.btn-cancel{padding:12px 22px;background:transparent;border:1px solid #2a2f42;border-radius:8px;color:#8b91a8;font-size:14px;font-family:'DM Sans',sans-serif;cursor:pointer;transition:.15s}
.btn-cancel:hover{border-color:#8b91a8;color:#e8eaf0}
.btn-pdf{display:flex;align-items:center;gap:7px;padding:12px 20px;background:#1e2a4a;border:1px solid #3b7ef8;border-radius:8px;color:#5b9bff;font-size:13px;font-weight:600;font-family:'DM Sans',sans-serif;cursor:pointer;transition:.15s}
.btn-pdf:hover{background:#243352}

.detail-bank-row{background:#181c27;border:1px solid #2a2f42;border-radius:8px;padding:14px 16px;margin-bottom:8px}
.dbr-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px;flex-wrap:wrap;gap:8px}
.dbr-bname{font-size:13px;font-weight:600;color:#e8eaf0;display:flex;align-items:center;gap:8px}
.dbr-status{font-size:12px;font-weight:600}
.dbr-defesa{font-size:12px;color:#f59e0b;margin-top:4px;display:flex;align-items:center;gap:5px}
.dbr-obs{font-size:12px;color:#8b91a8;font-style:italic;margin-top:4px}

.toast{position:fixed;bottom:28px;right:28px;background:#22c55e;color:#fff;padding:12px 20px;border-radius:9px;font-size:13px;font-weight:500;z-index:9999;opacity:0;transform:translateY(10px);transition:.3s;pointer-events:none;max-width:300px}
.toast.show{opacity:1;transform:translateY(0)}

@media(max-width:768px){
  .sidebar{width:60px}
  .sidebar-logo-text,.nav-item span,.user-name,.user-role{display:none}
  .nav-item{justify-content:center;padding:12px}
  .main{margin-left:60px}
  .metrics-grid{grid-template-columns:1fr}
  .table-head,.table-row{grid-template-columns:1fr 1fr 80px}
  .table-head span:nth-child(3),.table-head span:nth-child(4),
  .table-row>div:nth-child(3),.table-row>div:nth-child(4){display:none}
  .field-grid{grid-template-columns:1fr}
  .content{padding:16px}
}
</style>
</head>
<body>

<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">
      <div class="login-logo-icon">🏦</div>
      <span class="login-logo-text">CreditFlow</span>
    </div>
    <div class="login-title">Bem-vindo de volta</div>
    <div class="login-sub">Sistema de retorno bancário</div>
    <div class="form-group">
      <label class="form-label">Usuário</label>
      <input class="form-input" id="loginUser" type="text" placeholder="seu@email.com">
    </div>
    <div class="form-group">
      <label class="form-label">Senha</label>
      <input class="form-input" id="loginPass" type="password" placeholder="••••••••">
    </div>
    <button class="btn-login" onclick="doLogin()">Entrar no sistema</button>
    <div id="loginError" class="login-error">Usuário ou senha incorretos.</div>
    <div class="login-hint">admin@creditflow.com.br · 123456</div>
  </div>
</div>

<div id="app">
  <div class="sidebar">
    <div class="sidebar-logo">
      <div class="sidebar-logo-icon">🏦</div>
      <span class="sidebar-logo-text">CreditFlow</span>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-item active" id="nav-dash" onclick="goPage('dashboard')">
        <i class="ti ti-layout-dashboard"></i><span>Dashboard</span>
      </div>
      <div class="nav-item" id="nav-nova" onclick="goPage('nova')">
        <i class="ti ti-plus"></i><span>Nova Proposta</span>
      </div>
      <div class="nav-item" id="nav-propostas" onclick="goPage('propostas')">
        <i class="ti ti-list"></i><span>Propostas</span>
      </div>
    </nav>
    <div class="sidebar-footer">
      <div class="user-chip">
        <div class="user-avatar" id="userAvatar">AD</div>
        <div><div class="user-name" id="userName">Admin</div><div class="user-role">Gestor</div></div>
        <button class="btn-logout" onclick="doLogout()" title="Sair"><i class="ti ti-logout"></i></button>
      </div>
    </div>
  </div>
  <div class="main">
    <div class="topbar">
      <div>
        <div class="page-title" id="pageTitle">Dashboard</div>
        <div class="page-sub" id="pageSub">Visão geral de propostas</div>
      </div>
      <div><div class="date-chip" id="datechip"></div></div>
    </div>
    <div class="content" id="mainContent"></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
const USERS=[
  {user:'admin@creditflow.com.br',pass:'123456',name:'Admin',initials:'AD'},
];

const BASE='https://raw.githubusercontent.com/Tgentil/Bancos-em-SVG/main/';
const BANKS=[
  {id:'itau',     name:'Itaú',           color:'#EC7000',initials:'IT', logo:BASE+'Ita%C3%BA%20Unibanco%20S.A/itau-fundo-azul.svg'},
  {id:'bradesco', name:'Bradesco',        color:'#CC0000',initials:'BD', logo:BASE+'Bradesco%20S.A/bradesco.svg'},

  {id:'bb',       name:'Banco do Brasil', color:'#D4A800',initials:'BB', logo:BASE+'Banco%20do%20Brasil%20S.A/banco-do-brasil-sem-fundo.svg'},
  {id:'caixa',    name:'Caixa',           color:'#0070AF',initials:'CEF',logo:BASE+'Caixa%20Econ%C3%B4mica%20Federal/caixa-economica-federal-X.svg'},

  {id:'inter',    name:'Inter',           color:'#FF7A00',initials:'INT',logo:BASE+'Banco%20Inter%20S.A/inter.svg'},
  {id:'c6',       name:'C6 Bank',         color:'#2D2D2D',initials:'C6', logo:BASE+'Banco%20C6%20S.A/c6%20bank.svg'},
  {id:'sicoob',   name:'Sicoob',          color:'#00724E',initials:'SCB',logo:BASE+'Sicoob/sicoob-vector-logo.svg'},
  {id:'sicredi',  name:'Sicredi',         color:'#008C45',initials:'SCR',logo:BASE+'Sicredi/logo-svg2.svg'},
  {id:'original', name:'Banco Original',  color:'#009B57',initials:'ORI',logo:BASE+'Banco%20Original%20S.A/banco-original-logo-verde.svg'},
  {id:'bmg',      name:'BMG',             color:'#D4007A',initials:'BMG',logo:BASE+'Banco%20BMG/logo-bmg.svg'},
  {id:'pan',      name:'Banco Pan',       color:'#E30613',initials:'PAN',logo:'https://logospng.org/download/banco-pan/logo-banco-pan-256.png'},
  {id:'safra',    name:'Safra',           color:'#1A3A6B',initials:'SAF',logo:BASE+'Banco%20Safra%20S.A/logo-safra.svg'},
  {id:'daycoval', name:'Daycoval',        color:'#003082',initials:'DAY',logo:BASE+'Banco%20Daycoval/logo-Daycoval-%20maior.svg'},
  {id:'bv',       name:'Banco BV',        color:'#662D91',initials:'BV', logo:BASE+'Banco%20Votorantim/banco-votorantim.svg'},
  {id:'cashme',   name:'CashMe',          color:'#00C2CB',initials:'CM', logo:'https://cashme.com.br/wp-content/themes/cashme/assets/images/logo-cashme-azul.svg'},
  {id:'tcash',    name:'T-Cash',          color:'#FF4D00',initials:'TC', logo:null},
  {id:'galleria', name:'Galleria Bank',   color:'#B8860B',initials:'GAL',logo:null},
  {id:'paulista', name:'Banco Paulista',  color:'#009639',initials:'BP', logo:BASE+'Banco%20Paulista/banco-paulista.svg'},
  {id:'pontte',   name:'Pontte',          color:'#6C63FF',initials:'PON',logo:'https://pontte.com.br/img/logo.svg'},
];

const R_AP=[
  {label:'Aprovado',tipo:'ap'},
  {label:'Aprovado com restrição',tipo:'ap'},
  {label:'Aprovado — aguarda documentos',tipo:'ap'},
];
const R_PEN=[
  {label:'Em análise',tipo:'pen'},
  {label:'Pendente de documentação',tipo:'pen'},

let loggedUser=null;

function save(){localStorage.setItem('cf_proposals',JSON.stringify(proposals));}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function today(){return new Date().toISOString().split('T')[0];}
function fmtDate(s){if(!s)return'';const[y,m,d]=s.split('-');return`${d}/${m}/${y}`;}
function nowFull(){return new Date().toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});}

function doLogin(){
  const u=document.getElementById('loginUser').value.trim();
  const p=document.getElementById('loginPass').value;
  const found=USERS.find(x=>x.user===u&&x.pass===p);
  const err=document.getElementById('loginError');
  if(found){
    loggedUser=found;
    err.style.display='none';
    document.getElementById('loginScreen').style.display='none';
    document.getElementById('app').style.display='block';
    document.getElementById('datechip').textContent=nowFull();
    document.getElementById('userAvatar').textContent=found.initials;
    document.getElementById('userName').textContent=found.name;
    goPage('dashboard');
  } else {
    err.style.display='block';
    document.getElementById('loginUser').style.borderColor='#ef4444';
    document.getElementById('loginPass').style.borderColor='#ef4444';
    setTimeout(()=>{
      document.getElementById('loginUser').style.borderColor='';
      document.getElementById('loginPass').style.borderColor='';
    },1500);
  }
}

function doLogout(){
  loggedUser=null;
  document.getElementById('app').style.display='none';
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('loginPass').value='';
}

function goPage(p){
  ['dash','nova','propostas'].forEach(id=>{
    const el=document.getElementById('nav-'+id);
    if(el)el.classList.remove('active');
  });
  const map={dashboard:'nav-dash',nova:'nav-nova',propostas:'nav-propostas'};
  if(map[p]&&document.getElementById(map[p]))document.getElementById(map[p]).classList.add('active');
  if(p==='dashboard')renderDashboard();
  else if(p==='nova'){if(!editingId){selectedBanks=[];retornoState={};}renderNova();}
  else if(p==='propostas'){editingId=null;renderPropostas();}
  else if(p==='detalhe')renderDetalhe();
}

function statusOf(prop){
  const vals=Object.values(prop.retornos||{});
  if(!vals.length)return'pen';
  if(vals.every(v=>v.tipo==='ap'))return'ap';
  if(vals.some(v=>v.tipo==='ap'))return'mix';
  if(vals.every(v=>v.tipo==='neg'))return'neg';
  return'pen';
}
const STATUS_LABEL={ap:'Aprovado',neg:'Recusado',pen:'Em análise',mix:'Misto'};

function selR(id,idx){
  if(!retornoState[id])retornoState[id]={};
  retornoState[id].retornoIdx=idx;
  delete retornoState[id].defesa;
  renderRetornos();
}
function selDef(id,val){
  if(!retornoState[id])retornoState[id]={};
  retornoState[id].defesa=val;
  renderRetornos();
}
function updObs(id,val){
  if(!retornoState[id])retornoState[id]={};
  retornoState[id].obs=val;
}

function saveProposal(){
  const nome=document.getElementById('fNome').value.trim();
  if(!nome){
    document.getElementById('fNome').style.borderColor='#ef4444';
    document.getElementById('fNome').focus();
    setTimeout(()=>document.getElementById('fNome').style.borderColor='',1800);
    showToast('Informe o nome do cliente','#ef4444');return;
  }
  if(!selectedBanks.length){showToast('Selecione ao menos um banco','#f59e0b');return;}
  const prop={
    id:editingId||uid(),
    nome,
    cpf:document.getElementById('fCpf').value.trim(),
    produto:document.getElementById('fProduto').value,
    valor:document.getElementById('fValor').value.trim(),
    imovel:document.getElementById('fImovel')?document.getElementById('fImovel').value.trim():'',
    renda:document.getElementById('fRenda')?document.getElementById('fRenda').value.trim():'',
    banks:[...selectedBanks],
    retornos:JSON.parse(JSON.stringify(retornoState)),
    date:today(),
  };
  if(editingId){const i=proposals.findIndex(x=>x.id===editingId);proposals[i]=prop;}
  else proposals.unshift(prop);
  save();editingId=null;
  showToast('Proposta salva com sucesso!');
  setTimeout(()=>goPage('propostas'),500);
}

function drawOCAPage(doc){
  const W=210,H=297;
  // Diagonal stripe decoration (right side) — OCA style
  // Light sage/gray stripes like the letterhead
  const stripeColor=[220,225,215];
  doc.setFillColor(...stripeColor);
  // Main wide diagonal stripe
  doc.setGState(new doc.GState({opacity:0.45}));
  // We simulate diagonal stripes using thin rotated rectangles via polygon
  // Stripe 1 - wide
  doc.setFillColor(210,218,208);
  const s1=[{x:148,y:0},{x:210,y:0},{x:210,y:H},{x:162,y:H}];
  doc.triangle(148,0,210,0,210,H,'F');
  doc.triangle(148,0,210,H,162,H,'F');
  // Stripe 2 - narrower, offset
  doc.setFillColor(228,233,226);
  doc.triangle(168,0,185,0,210,H,'F');
  doc.triangle(168,0,210,H,195,H,'F');
  // Stripe 3 - thin accent
  doc.setFillColor(238,241,236);
  doc.triangle(190,0,200,0,210,55,'F');
  doc.setGState(new doc.GState({opacity:1}));

  // OCA Logo text at top center
  doc.setFont('helvetica','bold');
  doc.setFontSize(18);

function exportPDF(id){
  const p=proposals.find(x=>x.id===id);if(!p)return;
  const {jsPDF}=window.jspdf;
  const doc=new jsPDF({unit:'mm',format:'a4'});
  const W=210,M=18;
  const CONTENT_MAX_Y=265;

  // Color map for status
  const rgbTipo={ap:[52,153,88],neg:[196,56,56],pen:[186,130,20],info:[60,110,180],'':[130,135,125]};
  const bgTipo={ap:[235,248,238],neg:[253,235,235],pen:[254,248,228],info:[232,240,253],'':[242,242,240]};
  const bankColorHex={
    itau:'#EC7000',bradesco:'#CC0000',santander:'#EC0000',bb:'#D4A800',caixa:'#0070AF',
    nubank:'#820AD1',inter:'#FF7A00',c6:'#444444',sicoob:'#00724E',sicredi:'#008C45',
    original:'#009B57',bmg:'#D4007A',pan:'#E30613',safra:'#1A3A6B',daycoval:'#003082',
    bv:'#662D91',cashme:'#00C2CB',tcash:'#FF4D00',galleria:'#B8860B',paulista:'#009639',pontte:'#6C63FF'
  };
  function hexToRgb(hex){
    const r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);
    return[r,g,b];
  }

  let pageNum=1;
  function newPage(){
    doc.addPage();pageNum++;
    drawOCAPage(doc);
  }
  function checkY(neededH){
    if(y+neededH>CONTENT_MAX_Y){newPage();y=38;}
  }

  drawOCAPage(doc);
  let y=36;

  // ── REPORT TITLE ──
  doc.setFont('helvetica','bold');
  doc.setFontSize(13);
  doc.setTextColor(65,72,58);
  doc.text('RELATÓRIO DE RETORNO BANCÁRIO',M,y);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(130,138,120);
  doc.text('Gerado em '+new Date().toLocaleDateString('pt-BR')+' às '+new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'}),M,y+6);
  y+=14;

  // ── CLIENT CARD ──
  doc.setFillColor(245,247,242);
  doc.setDrawColor(195,205,185);
  doc.setLineWidth(0.3);
  doc.roundedRect(M-2,y-2,W-M-M+4-20,36,2,2,'FD');
  doc.setFont('helvetica','bold');
  doc.setFontSize(12);
  doc.setTextColor(55,65,48);
  doc.text(p.nome,M+2,y+7);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8.5);
  doc.setTextColor(100,108,90);
  let clientY=y+14;
  if(p.cpf){doc.text('CPF: '+p.cpf,M+2,clientY);clientY+=6;}
  if(p.produto){
    doc.text(p.produto,M+2,clientY);clientY+=6;
  }
  if(p.valor||p.imovel||p.renda){
    let vals=[];
    if(p.valor)vals.push('Valor solicitado: '+p.valor);
    if(p.imovel)vals.push('Imóvel: '+p.imovel);
    if(p.renda)vals.push('Renda: '+p.renda);
    doc.text(vals.join('   |   '),M+2,clientY);
  }
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(130,138,120);
  doc.text('Data: '+fmtDate(p.date),W-M-25,y+7);
  y+=44;

  // ── SECTION TITLE ──
  doc.setFont('helvetica','bold');
  doc.setFontSize(9);
  doc.setTextColor(90,100,80);
  doc.text('RETORNO POR INSTITUIÇÃO FINANCEIRA  ('+p.banks.length+' banco'+(p.banks.length!==1?'s':'')+' consultado'+(p.banks.length!==1?'s':'')+')',M,y);
  doc.setDrawColor(175,188,165);
  doc.setLineWidth(0.4);
  doc.line(M,y+2,W-M-22,y+2);
  y+=10;

  // ── BANK BLOCKS ──
  (p.banks||[]).forEach((bid,i)=>{
    const b=BANKS.find(x=>x.id===bid);
    const st=p.retornos?.[bid]||{};
    const r=st.retornoIdx!==undefined?ALL_R[st.retornoIdx]:null;
    const tipo=r?r.tipo:'';
    const cor=rgbTipo[tipo]||rgbTipo[''];
    const bgc=bgTipo[tipo]||bgTipo[''];
    const bkHex=bankColorHex[bid]||'#888888';
    const bkRgb=hexToRgb(bkHex);

    let blockH=20;
    if(st.defesa!==undefined)blockH+=7;
    if(st.obs)blockH+=7;

    checkY(blockH+4);

    // Card background
    doc.setFillColor(250,251,248);
    doc.setDrawColor(210,218,205);
    doc.setLineWidth(0.25);
    doc.roundedRect(M-2,y-2,W-M-M+4-22,blockH,1.5,1.5,'FD');

    // Bank color left accent bar
    doc.setFillColor(...bkRgb);
    doc.roundedRect(M-2,y-2,4,blockH,1,1,'F');
    doc.rect(M,y-2,2,blockH,'F');

    // Bank initials badge
    doc.setFillColor(...bkRgb);
    doc.roundedRect(M+6,y+1,12,12,2,2,'F');
    doc.setFont('helvetica','bold');
    doc.setFontSize(7);
    doc.setTextColor(255,255,255);
    const ini=b.initials||b.name.slice(0,3).toUpperCase();
    const iniW=doc.getTextWidth(ini);
    doc.text(ini,M+6+6-iniW/2,y+9);

    // Bank name
    doc.setFont('helvetica','bold');
    doc.setFontSize(10.5);
    doc.setTextColor(50,58,45);
    doc.text(b.name,M+22,y+9);

    // Status badge (right)
    const statusLabel=r?r.label:'Sem retorno';
    doc.setFillColor(...bgc);
    doc.setDrawColor(...cor);
    doc.setLineWidth(0.3);
    const slW=doc.getTextWidth(statusLabel)+8;
    const badgeX=W-M-22-slW;
    doc.roundedRect(badgeX,y+2,slW,10,2,2,'FD');
    doc.setFont('helvetica','bold');
    doc.setFontSize(8);
    doc.setTextColor(...cor);
    doc.text(statusLabel,badgeX+4,y+9);

    let cy=y+17;

    // Defesa row
    if(st.defesa!==undefined){
      const dt=st.defesa==='nao'?'Sem contestação':'Defesa: '+(DEFESAS[parseInt(st.defesa)]||'');
      doc.setFont('helvetica','italic');
      doc.setFontSize(8);
      doc.setTextColor(st.defesa==='nao'?[140,140,130]:[160,110,20]);
      doc.text('\u26A0  '+dt,M+6,cy);
      cy+=7;
    }

    // Obs row
    if(st.obs){
      doc.setFont('helvetica','italic');
      doc.setFontSize(8);
      doc.setTextColor(120,128,110);
      const obsText='"'+st.obs+'"';
      doc.text(obsText,M+6,cy,{maxWidth:W-M-M-30});
    }

    y+=blockH+5;
  });

  // ── SUMMARY BOX ──
  checkY(32);
  y+=4;
  const apCount=(p.banks||[]).filter(bid=>{const st=p.retornos?.[bid];const r=st&&st.retornoIdx!==undefined?ALL_R[st.retornoIdx]:null;return r&&r.tipo==='ap';}).length;
  const negCount=(p.banks||[]).filter(bid=>{const st=p.retornos?.[bid];const r=st&&st.retornoIdx!==undefined?ALL_R[st.retornoIdx]:null;return r&&r.tipo==='neg';}).length;
  const penCount=p.banks.length-apCount-negCount;

  doc.setFillColor(245,248,243);
  doc.setDrawColor(185,198,175);
  doc.setLineWidth(0.3);
  doc.roundedRect(M-2,y,W-M-M+4-22,22,2,2,'FD');
  doc.setFont('helvetica','bold');
  doc.setFontSize(8);
  doc.setTextColor(70,80,60);
  doc.text('RESUMO',M+3,y+7);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  const sumItems=[
    {label:'Aprovados',val:apCount,c:[52,153,88]},
    {label:'Recusados',val:negCount,c:[196,56,56]},
    {label:'Em andamento',val:penCount,c:[186,130,20]},
    {label:'Total consultado',val:p.banks.length,c:[70,80,60]},
  ];
  let sx=M+3;
  sumItems.forEach(s=>{
    doc.setTextColor(...s.c);
    doc.setFont('helvetica','bold');
    doc.text(String(s.val),sx,y+15);
    doc.setFont('helvetica','normal');
    doc.setFontSize(7);
    doc.setTextColor(120,128,110);
    doc.text(s.label,sx+5,y+15);
    sx+=42;
  });

  doc.save('retorno_bancario_'+p.nome.replace(/\s+/g,'_').toLowerCase()+'.pdf');
  showToast('PDF exportado com sucesso!');
}


function maskCPF(el){
  el.addEventListener('input',function(){
    let v=this.value.replace(/\D/g,'').slice(0,11);
    if(v.length>9)v=v.replace(/(\d{3})(\d{3})(\d{3})(\d{0,2})/,'$1.$2.$3-$4');
    else if(v.length>6)v=v.replace(/(\d{3})(\d{3})(\d{0,3})/,'$1.$2.$3');
    else if(v.length>3)v=v.replace(/(\d{3})(\d{0,3})/,'$1.$2');
    this.value=v;
  });
}

function maskBRL(el){
  el.addEventListener('input',function(){
    let v=this.value.replace(/\D/g,'');
    if(!v){this.value='';return;}
    let num=parseInt(v,10);
    this.value='R$ '+num.toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
  });
  el.addEventListener('focus',function(){
    if(!this.value)this.value='R$ ';
  });
  el.addEventListener('blur',function(){
    if(this.value==='R$ ')this.value='';
  });
}

function attachMasks(){
  const cpf=document.getElementById('fCpf');
  if(cpf)maskCPF(cpf);
  ['fValor','fImovel','fRenda'].forEach(id=>{
    const el=document.getElementById(id);
    if(el)maskBRL(el);
  });
}

function showToast(msg,color='#22c55e'){
  const t=document.getElementById('toast');
  t.textContent=msg;t.style.background=color;
  t.classList.add('show');
  clearTimeout(t._to);
  t._to=setTimeout(()=>t.classList.remove('show'),2800);
}
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&document.getElementById('loginScreen').style.display!=='none')doLogin();
});
